{% extends "base.html" %}

{% block title %}Create Account — AI Career OS{% endblock %}

{% block content %}
<style>
    .auth-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 11rem);
        padding: 1rem 0;
    }

    .auth-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 24px;
        padding: 3rem 2.5rem;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        transition: var(--transition);
    }

    .auth-header {
        text-align: center;
        margin-bottom: 2.5rem;
    }

    .auth-title {
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: -0.03em;
        margin-bottom: 0.5rem;
        color: var(--text-primary);
    }

    .auth-subtitle {
        font-size: 0.875rem;
        color: var(--text-secondary);
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-label {
        display: block;
        font-size: 0.8125rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
        color: var(--text-secondary);
        letter-spacing: -0.01em;
    }

    .form-control {
        width: 100%;
        padding: 0.8rem 1.2rem;
        font-family: 'Poppins', sans-serif;
        font-size: 0.875rem;
        background-color: var(--bg-secondary);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        border-radius: 12px;
        transition: var(--transition);
        outline: none;
    }

    .form-control:focus {
        border-color: var(--text-secondary);
        background-color: var(--bg-primary);
    }

    .auth-btn {
        width: 100%;
        padding: 0.85rem;
        border-radius: 12px;
        font-size: 0.875rem;
        font-weight: 500;
        margin-top: 1rem;
        border: none;
    }

    .auth-footer {
        text-align: center;
        margin-top: 2rem;
        font-size: 0.8125rem;
        color: var(--text-secondary);
    }

    .auth-footer a {
        color: var(--text-primary);
        text-decoration: none;
        font-weight: 500;
        transition: var(--transition);
    }

    .auth-footer a:hover {
        opacity: 0.8;
    }

    @media (max-width: 480px) {
        .auth-card {
            padding: 2.5rem 1.5rem;
            border: none;
            background: transparent;
            box-shadow: none;
        }
    }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Get started</h1>
            <p class="auth-subtitle">Initialize your intelligent career workspace</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
            {# {{ form.csrf_token }} #}
            
            <div class="form-group">
                <label for="fullname" class="form-label">Full Name</label>
                <input type="text" id="fullname" name="name" class="form-control" placeholder="Alex Morgan" required autocomplete="name">
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn btn-primary auth-btn">Create Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
