{% extends "base.html" %}

{% block title %}
Resume Analysis
{% endblock %}

{% block content %}

<div class="dashboard-container">

    <div class="console-panel">

        <h2 class="panel-title">
            Resume Analysis
        </h2>
<div class="metric-card">

    <h3>Resume Score</h3>

    <p style="font-size: 2rem; color: green; font-weight: bold;">
        {{ analysis.score }}/100
    </p>

</div>
        <div class="metric-card">
            <h3>Name</h3>
            <p>{{ analysis.name }}</p>
        </div>

        <div class="metric-card">
            <h3>Email</h3>
            <p>{{ analysis.email }}</p>
        </div>

        <div class="metric-card">
            <h3>Phone</h3>
            <p>{{ analysis.phone }}</p>
        </div>

        <div class="metric-card">
            <h3>Skills</h3>
            <p>{{ analysis.skills }}</p>
        </div>

    </div>

</div>

{% endblock %}
